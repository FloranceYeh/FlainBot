<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FlainBot Node Planner</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="workbench-topbar">
        <h1 class="workbench-title">FlainBot</h1>
        <nav class="topbar-tabs" aria-label="Views">
          <button class="view-tab" data-route="planner" type="button">Planner</button>
          <button class="view-tab" data-route="providers" type="button">Providers</button>
          <button class="view-tab" data-route="chat" type="button">Chat</button>
        </nav>
      </header>

      <main>
        <section id="planner-view" class="planner-workbench result-collapsed view" data-view="planner">
          <aside class="node-shelf" aria-labelledby="library-title">
            <div class="shelf-header">
              <h2 id="library-title">Nodes</h2>
              <input id="node-search" type="search" autocomplete="off" placeholder="Search nodes">
              <div class="node-filters" aria-label="Node filters">
                <details id="node-filter-dropdown" class="filter-dropdown">
                  <summary id="node-filter-summary">Filters</summary>
                  <section class="filter-section" data-filter-label="Package">
                    <h3 id="package-filter-summary">Package</h3>
                    <div id="package-filter-options" class="filter-options"></div>
                  </section>
                  <section class="filter-section" data-filter-label="Input type">
                    <h3 id="input-type-filter-summary">Input type</h3>
                    <div id="input-type-filter-options" class="filter-options"></div>
                  </section>
                  <section class="filter-section" data-filter-label="Output type">
                    <h3 id="output-type-filter-summary">Output type</h3>
                    <div id="output-type-filter-options" class="filter-options"></div>
                  </section>
                </details>
              </div>
            </div>
            <div id="node-library" class="node-list"></div>
          </aside>

          <section class="canvas-panel" aria-labelledby="graph-title">
            <div class="canvas-toolbar">
              <h2 id="graph-title">FlainBot Node Planner</h2>
              <p id="status-message" class="status-message" role="status" aria-live="polite"></p>
              <span id="graph-count" class="count">0 nodes</span>
              <div class="canvas-actions">
                <button id="save-graph" type="button">Save</button>
                <button id="reset-graph" type="button">Reset</button>
              </div>
            </div>
            <div id="graph-canvas" class="graph-canvas">
              <div id="canvas-space" class="canvas-space" data-canvas-space>
                <svg id="edge-layer" class="edge-layer">
                  <defs>
                    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                      <polygon points="0 0, 10 3.5, 0 7"></polygon>
                    </marker>
                  </defs>
                </svg>
                <div id="node-layer" class="node-layer"></div>
              </div>
            </div>
          </section>

          <aside id="result-panel" class="result-rail collapsed" aria-label="Results">
            <button id="toggle-result-panel" class="result-toggle" type="button" aria-expanded="false" title="Toggle generated output">
              <span class="result-toggle-label">Generated Python</span>
            </button>
            <div id="python-panel" class="result-section">
              <div class="result-actions">
                <button id="copy-code" type="button">Copy</button>
              </div>
              <pre><code id="python-code"></code></pre>
            </div>
          </aside>
        </section>

        <section id="providers-view" class="view providers-shell" data-view="providers" hidden>
          <section class="panel provider-editor" aria-labelledby="providers-title">
            <div class="section-header">
              <h2 id="providers-title">Providers</h2>
              <span class="count">Create reusable provider configs for Call Provider nodes.</span>
            </div>
            <form id="provider-form" class="provider-form" autocomplete="off">
              <div class="field">
                <label>ID</label>
                <input name="id" placeholder="provider-id" required>
              </div>
              <div class="field">
                <label>Format</label>
                <select name="format">
                  <option value="openai_chat">OpenAI Chat</option>
                  <option value="anthropic_messages">Anthropic Messages</option>
                </select>
              </div>
              <div class="field">
                <label>Base URL</label>
                <input name="base_url" placeholder="provider-base-url" required>
              </div>
              <div class="field">
                <label>API Key</label>
                <input name="api_key">
              </div>
              <div class="field">
                <label>Model</label>
                <input name="model" placeholder="your-model-name" required>
              </div>
              <button type="submit">Save Provider</button>
            </form>
          </section>
          <section class="panel provider-list-panel" aria-labelledby="provider-list-title">
            <div class="section-header">
              <h2 id="provider-list-title">Configured Providers</h2>
            </div>
            <div id="provider-list" class="provider-list"></div>
          </section>
        </section>

        <section id="chat-view" class="view chat-shell" data-view="chat" hidden>
          <header class="chat-header">
            <h2>FlainBot Chat</h2>
            <p>Graph runtime: input node to model node to output node.</p>
          </header>
          <section id="messages" class="messages" aria-live="polite"></section>
          <form id="chat-form" class="composer">
            <input id="message-input" name="message" autocomplete="off" placeholder="Type a message">
            <button type="submit">Send</button>
          </form>
        </section>
      </main>
    </div>
    <div id="node-preview-popover" class="node-preview" hidden></div>

    <script src="app.js"></script>
  </body>
</html>
